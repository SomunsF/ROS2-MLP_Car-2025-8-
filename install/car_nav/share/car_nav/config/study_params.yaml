# 自定义规划服务器
planner_server: 
  ros__parameters:
    expected_planner_frequency: 10.0  # 规划器的期望频率（Hz）
    planner_plugins: ["GridBased"]  # 使用的规划器插件列表
    
    GridBased:
      plugin: "zzzplan/ZzzPlanner"  # 自定义规划器插件
      # 基础连接设置
      allow_diagonal: true  # 是否允许对角线移动
      connectivity: 8  # 连接性设置（8表示八方向连接）
      # 代价相关设置
      costmap_weight: 0.5  # 地图代价的权重
      lethal_cost_thres# 默认碰撞监测器  在检测到可能碰撞时，主动干预机器人速度命令（可以减速、停下甚至反向），是"检测+控制"一体化。

# 默认规划服务器
planner_server:
  ros__parameters:
    # 频率和超时设置
    expected_planner_frequency: 20.0  # 规划器的期望频率（Hz）
    costmap_update_timeout: 1.0  # 代价地图更新超时时间（秒）
    # 系统设置
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    # 插件配置
    planner_plugins: ['GridBased']  # 使用的规划器插件列表
    GridBased:
      plugin: 'nav2_navfn_planner::NavfnPlanner'  # 默认的全局规划器插件

# 默认行为树导航器
bt_navigator:
  ros__parameters:
    # 坐标系设置
    global_frame: map  # 全局坐标系
    robot_base_frame: base_link  # 机器人基座坐标系
    # 时间和容忍度设置
    transform_tolerance: 0.1  # 坐标变换的容忍度（秒）
    filter_duration: 0.3  # 滤波持续时间（秒）
    # 系统设置
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    always_reload_bt_xml: false  # 是否总是重新加载行为树文件
    # 行为树文件设置
    default_nav_to_pose_bt_xml: replace/with/path/to/bt.xml  # 导航到目标点的行为树文件路径
    default_nav_through_poses_bt_xml: replace/with/path/to/bt.xml  # 导航通过路径点的行为树文件路径
    # 黑板ID设置
    goal_blackboard_id: goal  # 目标点的黑板ID
    goals_blackboard_id: goals  # 多目标点的黑板ID
    path_blackboard_id: path  # 路径的黑板ID
    waypoint_statuses_blackboard_id: waypoint_statuses  # 路径点状态的黑板ID
    # 导航器配置
    navigators: ['navigate_to_pose', 'navigate_through_poses']  # 导航器插件列表
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"  # 导航到目标点的插件
      enable_groot_monitoring: false  # 是否启用Groot监控
      groot_server_port: 1667  # Groot服务器端口
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"  # 导航通过路径点的插件
      enable_groot_monitoring: false  # 是否启用Groot监控
      groot_server_port: 1669  # Groot服务器端口
    plugin_lib_names:  # 行为树插件库名称列表
      # 动作节点
      - nav2_back_up_action_bt_node  # 后退的行为树节点
      - nav2_compute_path_to_pose_action_bt_node  # 计算路径到目标点的行为树节点
      - nav2_follow_path_action_bt_node  # 跟随路径的行为树节点
      - nav2_spin_action_bt_node  # 原地旋转的行为树节点
      - nav2_wait_action_bt_node  # 等待的行为树节点
      # 服务节点
      - nav2_clear_costmap_service_bt_node  # 清除代价地图的行为树节点
      - nav2_reinitialize_global_localization_service_bt_node  # 重新初始化全局定位的行为树节点
      # 条件节点
      - nav2_distance_traveled_condition_bt_node  # 检查距离是否已行进的行为树节点
      - nav2_goal_reached_condition_bt_node  # 检查目标是否到达的行为树节点
      - nav2_goal_updated_condition_bt_node  # 检查目标是否更新的行为树节点
      - nav2_initial_pose_received_condition_bt_node  # 检查初始位姿是否接收的行为树节点
      - nav2_is_stopped_condition_bt_node  # 检查是否停止的行为树节点
      - nav2_is_stuck_condition_bt_node  # 检查是否卡住的行为树节点
      - nav2_time_expired_condition_bt_node  # 检查时间是否到期的行为树节点
      - nav2_transform_available_condition_bt_node  # 检查变换是否可用的行为树节点
      # 控制节点
      - nav2_distance_controller_bt_node  # 距离控制器行为树节点
      - nav2_pause_resume_controller_bt_node  # 暂停/恢复控制器行为树节点
      - nav2_rate_controller_bt_node  # 速率控制器行为树节点
      - nav2_speed_controller_bt_node  # 速度控制器行为树节点
      # 序列节点
      - nav2_persistent_sequence_bt_node  # 持久序列行为树节点
      - nav2_pipeline_sequence_bt_node  # 管道序列行为树节点
      # 其他节点
      - nav2_recovery_node_bt_node  # 恢复节点行为树节点
      - nav2_round_robin_node_bt_node  # 轮询节点行为树节点
      - nav2_single_trigger_bt_node  # 单次触发行为树节点
    error_code_name_prefixes:  # 错误代码名称前缀列表
      # 导航相关
      - nav_to_pose  # 导航到目标点
      - nav_thru_poses  # 导航通过路径点
      - compute_path  # 计算路径
      - follow_path  # 跟随路径
      # 移动行为
      - backup  # 后退
      - drive_on_heading  # 按航向行驶
      - spin  # 原地旋转
      - wait  # 等待
      # 对接相关
      - dock_robot  # 停靠机器人
      - undock_robot  # 取消停靠
      # 其他
      - assisted_teleop  # 辅助遥控
      - route  # 路线

# 默认全局代价地图
global_costmap:
  global_costmap:
    ros__parameters:
      # 坐标系设置
      global_frame: map  # 全局坐标系
      robot_base_frame: base_link  # 机器人基座坐标系
      # 地图参数
      resolution: 0.05  # 地图分辨率（米）
      robot_radius: 0.22 # radius set and used, so no footprint points
      footprint_padding: 0.03  # 足迹填充
      # 频率设置
      update_frequency: 1.0  # 更新频率（Hz）
      publish_frequency: 1.0  # 发布频率（Hz）
      # 系统设置
      always_send_full_costmap: True  # 是否总是发送完整的代价地图
      introspection_mode: "disabled"  # 自省模式，禁用以减少开销
      # 插件配置
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]  # 使用的地图插件列表
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 障碍物层插件
        enabled: True  # 是否启用
        footprint_clearing_enabled: true  # 是否启用足迹清除
        max_obstacle_height: 2.0  # 最大障碍物高度
        combination_method: 1  # 组合方法
        observation_sources: scan  # 观测源
        scan:
          topic: /scan  # 激光雷达话题
          data_type: "LaserScan"  # 数据类型
          clearing: True  # 是否清除
          marking: True  # 是否标记
          inf_is_valid: false  # 无穷大是否有效
          max_obstacle_height: 2.0  # 最大障碍物高度
          min_obstacle_height: 0.0  # 最小障碍物高度
          obstacle_max_range: 2.5  # 障碍物最大范围
          obstacle_min_range: 0.0  # 障碍物最小范围
          raytrace_max_range: 3.0  # 光线追踪最大范围
          raytrace_min_range: 0.0  # 光线追踪最小范围
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"  # 体素层插件
        enabled: True  # 是否启用
        footprint_clearing_enabled: true  # 是否启用足迹清除
        publish_voxel_map: True  # 是否发布体素地图
        combination_method: 1  # 组合方法
        observation_sources: pointcloud  # 观测源
        max_obstacle_height: 2.0  # 最大障碍物高度
        mark_threshold: 0  # 标记阈值
        unknown_threshold: 15  # 未知阈值
        origin_z: 0.0  # 原点Z坐标
        z_resolution: 0.05  # Z方向分辨率（米）
        z_voxels: 16  # Z方向体素数
        pointcloud:  # 点云配置
          topic: /intel_realsense_r200_depth/points  # 深度相机点云话题
          data_type: "PointCloud2"  # 数据类型
          transport_type: "raw"  # 传输类型：原始或压缩（zlib, draco, zstd）
          clearing: True  # 是否清除
          marking: True  # 是否标记
          max_obstacle_height: 2.0  # 最大障碍物高度
          min_obstacle_height: 0.0  # 最小障碍物高度
          obstacle_max_range: 2.5  # 障碍物最大范围
          obstacle_min_range: 0.0  # 障碍物最小范围
          raytrace_max_range: 3.0  # 光线追踪最大范围
          raytrace_min_range: 0.0  # 光线追踪最小范围
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态层插件
        enabled: true  # 是否启用
        map_subscribe_transient_local: True  # 地图订阅临时本地
        subscribe_to_updates: true  # 是否订阅更新
        transform_tolerance: 0.1  # 坐标变换的容忍度（秒）
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件
        enabled: true  # 是否启用
        cost_scaling_factor: 1.0  # 成本缩放因子
        inflation_radius: 0.55  # 膨胀半径
        inflate_around_unknown: true  # 是否在未知区域周围膨胀
        inflate_unknown: false  # 是否膨胀未知区域
        always_send_full_costmap: True  # 是否总是发送完整的代价地图
        introspection_mode: "disabled"  # 自省模式，禁用以减少开销

# 默认局部代价地图
local_costmap:
  local_costmap:
    ros__parameters:
      # 坐标系设置
      global_frame: odom  # 全局坐标系
      robot_base_frame: base_link  # 机器人基座坐标系
      # 地图参数
      height: 3  # 地图高度（个网格）
      width: 3  # 地图宽度（个网格）
      resolution: 0.05  # 地图分辨率（米）
      rolling_window: true  # 是否启用滚动窗口
      # 频率设置
      publish_frequency: 2.0  # 发布频率（Hz）
      update_frequency: 5.0  # 更新频率（Hz）
      # 系统设置
      introspection_mode: "disabled"  # 自省模式，禁用以减少开销

# 默认覆盖服务器，可替换全局规划器，但是是覆盖，类似牛耕地一样每一块都覆盖
coverage_server:
  ros__parameters:
    # 坐标系设置
    coordinates_in_cartesian_frame: true  # 坐标是否在笛卡尔坐标系中
    # 机器人参数
    robot_width: 2.1  # 机器人宽度
    operation_width: 2.5  # 操作宽度
    min_turning_radius: 0.4  # 最小转弯半径
    linear_curv_change: 2.0  # 线性曲率变化
    # 默认路径参数
    default_allow_overlap: true  # 默认允许重叠
    default_headland_width: 0.5  # 默认边头宽度
    default_path_continuity_type: "CONTINUOUS"  # 默认路径连续性类型
    default_path_type: "DUBINS"  # 默认路径类型
    default_route_type: "BOUSTROPHEDON"  # 默认路线类型
    default_swath_angle_type: "BRUTE_FORCE"  # 默认扫掠角度类型
    default_swath_type: "LENGTH"  # 默认扫掠类型
    default_turn_point_distance: 0.1  # 默认转弯点距离


# 默认控制器服务器
controller_server:
  ros__parameters:
    # 频率和超时设置
    controller_frequency: 20.0  # 控制器频率（Hz）
    costmap_update_timeout: 0.3  # 代价地图更新超时时间（秒）
    failure_tolerance: 0.3  # 失败容忍度
    # 速度阈值设置
    min_theta_velocity_threshold: 0.001  # 最小角速度阈值
    min_x_velocity_threshold: 0.001  # 最小X轴速度阈值
    min_y_velocity_threshold: 0.5  # 最小Y轴速度阈值
    # 里程计设置
    odom_duration: 0.3  # 里程计持续时间（秒）
    odom_topic: "odom"  # 里程计话题
    # 插件配置
    controller_plugins: ["FollowPath"]  # 控制器插件列表
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 简单进度检查器插件
      movement_time_allowance: 10.0  # 移动时间允许值
      required_movement_radius: 0.5  # 所需移动半径
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"  # 简单目标检查器插件
      stateful: True  # 是否有状态
      xy_goal_tolerance: 0.25  # XY方向目标容忍度
      yaw_goal_tolerance: 0.25  # 角度目标容忍度
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"  # 跟随路径控制器插件


# 默认地图服务器
map_server:
  ros__parameters:
    frame_id: "map"  # 坐标系ID
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    topic_name: "map"  # 地图话题名称
    yaml_filename: "turtlebot3_world.yaml"  # 地图文件名

# 默认地图保存服务器
map_saver:
  ros__parameters:
    free_thresh_default: 0.25  # 默认自由阈值
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    occupied_thresh_default: 0.65  # 默认占用阈值
    save_map_timeout: 5.0  # 保存地图超时时间（秒）

# 默认代价地图过滤信息服务器
# 地图服务器发布OccupancyGrid标注出禁止进入或者要减速的区域
# 这个服务器进行具体修饰说明 哪一块是禁止区哪一块是减速区，供全局/局部costmap使用
costmap_filter_info_server:
  ros__parameters:
    base: 0.0  # 基础值
    filter_info_topic: "costmap_filter_info"  # 过滤信息话题
    mask_topic: "filter_mask"  # 掩码话题
    multiplier: 0.25  # 乘数值
    type: 1  # 过滤器类型


# 默认amcl定位算法
amcl:
  ros__parameters:
    # 坐标系设置
    base_frame_id: "base_footprint"  # 基础框架ID
    global_frame_id: "map"  # 全局框架ID
    odom_frame_id: "odom"  # 里程计框架ID
    # 机器人模型
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 机器人模型类型
    # Alpha参数（运动噪声）
    alpha1: 0.2  # alpha1参数
    alpha2: 0.2  # alpha2参数
    alpha3: 0.2  # alpha3参数
    alpha4: 0.2  # alpha4参数
    alpha5: 0.2  # alpha5参数
    # 激光参数
    laser_likelihood_max_dist: 2.0  # 激光 Likelihood 最大距离
    laser_max_range: 100.0  # 激光最大范围
    laser_min_range: -1.0  # 激光最小范围
    laser_model_type: "likelihood_field"  # 激光模型类型
    max_beams: 60  # 最大光束数
    # 光束跳过参数
    beam_skip_distance: 0.5  # 光束跳过距离
    beam_skip_error_threshold: 0.9  # 光束跳过误差阈值
    beam_skip_threshold: 0.3  # 光束跳过阈值
    do_beamskip: false  # 是否执行光束跳过
    # 粒子滤波参数
    max_particles: 2000  # 最大粒子数
    min_particles: 500  # 最小粒子数
    pf_err: 0.05  # 粒子滤波器误差
    pf_z: 0.99  # 粒子滤波器Z值
    resample_interval: 1  # 重采样间隔
    # 更新参数
    update_min_a: 0.2  # 最小角度更新
    update_min_d: 0.25  # 最小距离更新
    # 恢复参数
    recovery_alpha_fast: 0.0  # 快速恢复alpha值
    recovery_alpha_slow: 0.0  # 慢速恢复alpha值
    # 位姿保存
    save_pose_rate: 0.5  # 保存位姿的频率
    # 激光模型权重
    lambda_short: 0.1  # 短光束的lambda值
    sigma_hit: 0.2  # 命中sigma值
    z_hit: 0.5  # 命中概率
    z_max: 0.05  # 最大Z值
    z_rand: 0.5  # 随机Z值
    z_short: 0.05  # 短光束Z值
    # 话题设置
    map_topic: map  # 地图话题
    scan_topic: scan  # 激光雷达话题
    # TF和系统设置
    tf_broadcast: true  # 是否广播TF
    transform_tolerance: 1.0  # 坐标变换的容忍度（秒）
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    # 初始位姿设置
    always_reset_initial_pose: false  # 是否总是重置初始位姿
    first_map_only: false  # 仅在第一次地图上工作
    set_initial_pose: false  # 是否设置初始位姿
    initial_pose:
      x: 0.0  # 初始X坐标
      y: 0.0  # 初始Y坐标
      z: 0.0  # 初始Z坐标
      yaw: 0.0  # 初始偏航角


# 默认行为服务器
behavior_server:
  ros__parameters:
    # 坐标系设置
    global_frame: map  # 全局坐标系
    local_frame: odom  # 局部坐标系
    robot_base_frame: base_link  # 机器人基座坐标系
    # 话题设置
    global_costmap_topic: global_costmap/costmap_raw  # 全局代价地图话题
    global_footprint_topic: global_costmap/published_footprint  # 全局足迹话题
    local_costmap_topic: local_costmap/costmap_raw  # 局部代价地图话题
    local_footprint_topic: local_costmap/published_footprint  # 局部足迹话题
    # 频率和时间设置
    cycle_frequency: 10.0  # 周期频率（Hz）
    simulate_ahead_time: 2.0  # 模拟前瞻时间
    transform_tolerance: 0.1  # 坐标变换的容忍度（秒）
    # 速度设置
    max_rotational_vel: 1.0  # 最大旋转速度
    min_rotational_vel: 0.4  # 最小旋转速度
    rotational_acc_lim: 3.2  # 旋转加速度限制
    # 系统设置
    enable_stamped_cmd_vel: true  # 是否启用带时间戳的速度命令（Jazzy或更早版本默认为false）
    # 行为插件配置
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]  # 行为插件列表
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"  # 辅助遥控行为插件
    backup:
      plugin: "nav2_behaviors::BackUp"  # 后退行为插件
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"  # 按航向行驶行为插件
    spin:
      plugin: "nav2_behaviors::Spin"  # 旋转行为插件
    wait:
      plugin: "nav2_behaviors::Wait"  # 等待行为插件

# 默认碰撞监测器  在检测到可能碰撞时，主动干预机器人速度命令（可以减速、停下甚至反向），是“检测+控制”一体化。
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"  # 基础框架ID
    odom_frame_id: "odom"  # 里程计框架ID
    cmd_vel_in_topic: "cmd_vel_smoothed"  # 输入平滑速度命令的话题
    cmd_vel_out_topic: "cmd_vel"  # 输出速度命令的话题
    state_topic: "collision_monitor_state"  # 状态话题
    transform_tolerance: 0.5  # 坐标变换的容忍度（秒）
    source_timeout: 5.0  # 源超时时间
    base_shift_correction: True  # 基础偏移修正
    stop_pub_timeout: 2.0  # 停止发布超时时间
    enable_stamped_cmd_vel: True  # 是否启用带时间戳的速度命令（Jazzy或更早版本默认为false）
    use_realtime_priority: false  # 是否使用实时优先级
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]  # 多边形列表
    PolygonStop:
      type: "circle"  # 形状类型
      action_type: "stop"  # 动作类型
      enabled: True  # 是否启用
      min_points: 4  # 最小点数
      polygon_pub_topic: "polygon_stop"  # 多边形发布话题
      radius: 0.3  # 半径
      visualize: True  # 是否可视化
    PolygonSlow:
      type: "polygon"  # 形状类型
      action_type: "slowdown"  # 动作类型
      enabled: True  # 是否启用
      min_points: 4  # 最小点数
      points: "[[1.0, 1.0], [1.0, -1.0], [-0.5, -1.0], [-0.5, 1.0]]"  # 顶点坐标
      polygon_pub_topic: "polygon_slowdown"  # 多边形发布话题
      slowdown_ratio: 0.3  # 减速比率
      visualize: True  # 是否可视化
    PolygonLimit:
      type: "polygon"  # 形状类型
      action_type: "limit"  # 动作类型
      angular_limit: 0.5  # 角限制
      enabled: True  # 是否启用
      linear_limit: 0.4  # 线性限制
      min_points: 4  # 最小点数
      points: "[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]"  # 顶点坐标
      polygon_pub_topic: "polygon_limit"  # 多边形发布话题
      visualize: True  # 是否可视化
    FootprintApproach:
      type: "polygon"  # 形状类型
      action_type: "approach"  # 动作类型
      enabled: True  # 是否启用
      footprint_topic: "/local_costmap/published_footprint"  # 足迹话题
      min_points: 6  # 最小点数
      simulation_time_step: 0.02  # 仿真时间步长
      time_before_collision: 2.0  # 碰撞前时间
      visualize: False  # 是否可视化
    VelocityPolygonStop:
      type: "velocity_polygon"  # 形状类型
      action_type: "stop"  # 动作类型
      enabled: True  # 是否启用
      holonomic: false  # 是否全向
      min_points: 6  # 最小点数
      polygon_pub_topic: "velocity_polygon_stop"  # 多边形发布话题
      velocity_polygons: ["rotation", "translation_forward", "translation_backward", "stopped"]  # 速度多边形列表
      visualize: True  # 是否可视化
      rotation:
        linear_max: 0.05  # 线性最大值
        linear_min: 0.0  # 线性最小值
        points: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"  # 旋转多边形顶点
        theta_max: 1.0  # 角度最大值
        theta_min: -1.0  # 角度最小值
      translation_forward:
        linear_max: 1.0  # 线性最大值
        linear_min: 0.0  # 线性最小值
        points: "[[0.35, 0.3], [0.35, -0.3], [-0.2, -0.3], [-0.2, 0.3]]"  # 前进多边形顶点
        theta_max: 1.0  # 角度最大值
        theta_min: -1.0  # 角度最小值
      translation_backward:
        linear_max: 0.0  # 线性最大值
        linear_min: -1.0  # 线性最小值
        points: "[[0.2, 0.3], [0.2, -0.3], [-0.35, -0.3], [-0.35, 0.3]]"  # 后退多边形顶点
        theta_max: 1.0  # 角度最大值
        theta_min: -1.0  # 角度最小值
      # This is the last polygon to be checked, it should cover the entire range of robot's velocities
      # It is used as the stopped polygon when the robot is not moving and as a fallback if the velocity
      # is not covered by any of the other sub-polygons
      stopped:
        linear_max: 1.0  # 线性最大值
        linear_min: -1.0  # 线性最小值
        points: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"  # 停止多边形顶点
        theta_max: 1.0  # 角度最大值
        theta_min: -1.0  # 角度最小值
    scan:
      enabled: True  # 是否启用
      source_timeout: 0.2  # 源超时时间
      topic: "/scan"  # 激光雷达话题
      type: "scan"  # 类型
    pointcloud:
      enabled: True  # 是否启用
      max_height: 0.5  # 最大高度
      min_height: 0.1  # 最小高度
      min_range: 0.2  # 最小范围
      topic: "/intel_realsense_r200_depth/points"  # 深度相机点云话题
      transport_type: "raw"  # 传输类型：原始或压缩（zlib, draco, zstd）
      type: "pointcloud"  # 类型


# 默认碰撞探测器  检测机器人是否即将碰撞（纯检测，不直接控制机器人运动）
collision_detector:
  ros__parameters:
    # 坐标系设置
    base_frame_id: "base_footprint"  # 基础框架ID
    odom_frame_id: "odom"  # 里程计框架ID
    # 时间和容忍度设置
    source_timeout: 5.0  # 源超时时间
    transform_tolerance: 0.5  # 坐标变换的容忍度（秒）
    # 系统设置
    base_shift_correction: True  # 基础偏移修正
    # 观测源配置
    observation_sources: ["scan"]  # 观测源
    # 多边形配置
    polygons: ["PolygonFront"]  # 多边形列表
    PolygonFront:
      type: "polygon"  # 形状类型
      action_type: "none"  # 动作类型
      min_points: 4  # 最小点数
      points: "[[0.3, 0.3], [0.3, -0.3], [0.0, -0.3], [0.0, 0.3]]"  # 顶点坐标
      polygon_pub_topic: "polygon_front"  # 多边形发布话题
      visualize: True  # 是否可视化
    scan:
      enabled: True  # 是否启用
      source_timeout: 0.2  # 源超时时间
      topic: "scan"  # 激光雷达话题
      type: "scan"  # 类型
    pointcloud:
      enabled: True  # 是否启用
      max_height: 0.5  # 最大高度
      min_height: 0.1  # 最小高度
      topic: "/intel_realsense_r200_depth/points"  # 深度相机点云话题
      transport_type: "raw"  # 传输类型：原始或压缩（zlib, draco, zstd）
      type: "pointcloud"  # 类型



# 默认平滑器服务器 主要是对路径几何（path points）做平滑
smoother_server:
  ros__parameters:
    # 坐标系设置
    robot_base_frame: base_link  # 机器人基座坐标系
    transform_tolerance: 0.1  # 坐标变换的容忍度（秒）
    # 话题设置
    costmap_topic: global_costmap/costmap_raw  # 代价地图话题
    footprint_topic: global_costmap/published_footprint  # 足迹话题
    # 在这里列出要注册的 smoother IDs
    smoother_plugins: ["savitzky_golay_smoother", "simple_smoother", "SmoothPath", ]

    # 每个 ID 对应一个 plugin 类型和参数
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"  # Savitzky-Golay平滑器插件
      do_refinement: True  # 是否进行细化
      enforce_path_inversion: True  # 是否强制路径反转
      refinement_num: 2  # 细化次数

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # 简单平滑器插件
      do_refinement: True  # 是否进行细化
      enforce_path_inversion: True  # 是否强制路径反转
      max_its: 1000  # 最大迭代次数
      refinement_num: 2  # 细化次数
      tolerance: 1.0e-10  # 容忍度
      w_data: 0.2  # 数据权重
      w_smooth: 0.3  # 平滑权重

    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"  # 受约束平滑器插件
      reversing_enabled: true       # 是否检测前进/后退方向和拐角。对于未分配方向的路径，应设置为false
      path_downsampling_factor: 3   # 路径下采样因子，每n个节点被采样。对于加速，可能需要设置为更高的值
      path_upsampling_factor: 1     # 路径上采样因子，0 - 路径保持下采样，1 - 路径按原始粒度上采样，2... - 更多上采样
      keep_start_orientation: true  # 是否防止起始方向被平滑
      keep_goal_orientation: true   # 是否防止目标方向被平滑
      minimum_turning_radius: 0.40  # 机器人可以执行的最小转弯半径。对于差分驱动/全向机器人，可以设置为0.0
      w_curve: 30.0                 # 权重，以强制执行最小转弯半径
      w_dist: 0.0                   # 权重，绑定路径到原始路径，作为成本权重的可选替代
      w_smooth: 2000000.0           # 权重，最大化路径平滑
      w_cost: 0.015                 # 权重，引导机器人远离碰撞和代价
      # Parameters used to improve obstacle avoidance near cusps (forward/reverse movement changes)
      w_cost_cusp_multiplier: 3.0   # 选项，在前进/后退方向变化时使用更高的权重，通常伴随危险旋转
      cusp_zone_length: 2.5         # 在拐角附近的区域长度，节点在此区域内使用w_cost_cusp_multiplier（w_cost在区域内逐渐增加，直到拐角点）
      # Points in robot frame to grab costmap values from. Format: [x1, y1, weight1, x2, y2, weight2, ...]
      # IMPORTANT: Requires much higher number of iterations to actually improve the path. Uncomment only if you really need it (highly elongated/asymmetric robots)
      # cost_check_points: [-0.185, 0.0, 1.0]
      optimizer:
        max_iterations: 70            # max iterations of smoother
        debug_optimizer: false        # print debug info
        gradient_tol: 5e3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

# 默认速度平滑器 主要是对速度（velocity）做平滑
velocity_smoother:
  ros__parameters:
    # 频率设置
    smoothing_frequency: 20.0  # 平滑频率（Hz）
    # 反馈设置
    feedback: "OPEN_LOOP"  # 反馈模式
    # 速度限制
    deadband_velocity: [0.0, 0.0, 0.0]  # 死区速度
    max_velocity: [0.5, 0.0, 2.5]  # 最大速度
    min_velocity: [-0.5, 0.0, -2.5]  # 最小速度
    # 加速度限制
    max_accel: [2.5, 0.0, 3.2]  # 最大加速度
    max_decel: [-2.5, 0.0, -3.2]  # 最大减速度
    # 里程计设置
    odom_duration: 0.1  # 里程计持续时间（秒）
    odom_topic: "odom"  # 里程计话题
    # 系统设置
    enable_stamped_cmd_vel: false  # 是否启用带时间戳的速度命令
    scale_velocities: false  # 是否缩放速度
    use_realtime_priority: false  # 是否使用实时优先级
    velocity_timeout: 1.0  # 速度超时时间


# 默认航点跟随器 主要是对路径（waypoints）做跟随
waypoint_follower:
  ros__parameters:
    # 频率设置
    loop_rate: 20  # 循环频率
    # 系统设置
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销
    stop_on_failure: false  # 失败时是否停止
    # 插件配置
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 航点任务执行器插件
    wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 等待航点插件
        enabled: True  # 是否启用
        waypoint_pause_duration: 0  # 航点暂停持续时间


# 默认回环模拟器 
# 快速验证 Nav2 行为树、planner/controller 逻辑、上层策略（巡逻、任务调度）、CI 自动化测试、多机器人布局验证等场景
loopback_simulator:
  ros__parameters:
    # 坐标系设置
    base_frame_id: "base_footprint"  # 基础框架ID
    map_frame_id: "map"  # 地图框架ID
    odom_frame_id: "odom"  # 里程计框架ID
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    # 时间设置
    update_duration: 0.02  # 更新持续时间
    # 扫描参数
    scan_angle_increment: 0.02617  # 扫描角度增量
    scan_angle_max: 3.1415  # 扫描最大角度
    scan_angle_min: -3.1415  # 扫描最小角度
    scan_range_max: 30.0  # 扫描最大范围
    scan_range_min: 0.05  # 扫描最小范围
    scan_use_inf: true  # 扫描使用无穷大

# 默认泊车服务器 主要是对泊车（docking）过程做管理
# 用于把机器人安全地靠入充电桩或其它对接机构（如传送带末端、托盘等）
docking_server:
  ros__parameters:
    # 坐标系设置
    base_frame: "base_link"  # 基础框架ID
    fixed_frame: "odom"  # 固定框架ID
    # 频率设置
    controller_frequency: 50.0  # 控制器频率（Hz）
    # 超时设置
    dock_approach_timeout: 30.0  # 靠近对接超时时间（秒）
    initial_perception_timeout: 5.0  # 初始感知超时时间（秒）
    wait_charge_timeout: 5.0  # 等待充电超时时间（秒）
    # 容忍度设置
    dock_prestaging_tolerance: 0.5  # 对接预定位容忍度
    undock_angular_tolerance: 0.1  # 取消对接角度容忍度
    undock_linear_tolerance: 0.05  # 取消对接线性容忍度
    # 重试设置
    max_retries: 3  # 最大重试次数
    # 里程计设置
    odom_duration: 0.3  # 里程计持续时间（秒）
    odom_topic: "odom"  # 里程计话题
    # 系统设置
    dock_backwards: false  # Deprecated, use dock_direction in plugin
    introspection_mode: "disabled"  # 自省模式，禁用以减少开销

    # Types of docks
    dock_plugins: ['nova_carter_dock']  # 对接插件列表
    nova_carter_dock:
      plugin: 'opennav_docking::SimpleChargingDock'  # 充电对接插件，也可以是'SimpleNonChargingDock'
      docking_threshold: 0.05  # 对接阈值
      staging_x_offset: -0.7  # 预定位X偏移
      use_external_detection_pose: true  # 是否使用外部检测位姿
      use_battery_status: false # true  # 是否使用电池状态
      use_stall_detection: false  # 是否使用失速检测
      rotate_to_dock: false  # 是否旋转对接

      external_detection_timeout: 1.0  # 外部检测超时时间
      external_detection_translation_x: -0.18  # 外部检测平移X
      external_detection_translation_y: 0.0  # 外部检测平移Y
      external_detection_rotation_roll: -1.57  # 外部检测滚动角
      external_detection_rotation_pitch: -1.57  # 外部检测俯仰角
      external_detection_rotation_yaw: 0.0  # 外部检测偏航角
      filter_coef: 0.1  # 滤波系数
      dock_direction: "forward" # "backward"  # 对接方向

    # Dock instances
    docks: ['home_dock']  # 对接点列表
    home_dock:
      type: 'nova_carter_dock'  # 对接类型
      frame: map  # 坐标系
      pose: [0.0, 0.0, 0.0]  # 位姿
      id: 'c67f50cb-e152-4720-85cc-5eb20bd85ce8'  # 对接点ID

    controller:
      k_phi: 3.0  # 角度控制增益
      k_delta: 2.0  # 线性控制增益
      v_linear_min: 0.15  # 最小线速度
      v_linear_max: 0.15  # 最大线速度
      v_angular_max: 0.75  # 最大角速度
      slowdown_radius: 0.25  # 减速半径
      rotate_to_heading_angular_vel: 1.0  # 旋转到航向的角速度
      rotate_to_heading_max_angular_accel: 3.2  # 旋转到航向的最大角加速度
      use_collision_detection: true  # 是否使用碰撞检测
      costmap_topic: "local_costmap/costmap_raw"  # 代价地图话题
      footprint_topic: "local_costmap/published_footprint"  # 足迹话题
      transform_tolerance: 0.1  # 坐标变换的容忍度（秒）
      projection_time: 1.0  # 投影时间
      simulation_time_step: 0.1  # 仿真时间步长
      dock_collision_threshold: 0.3  # 对接碰撞阈值



# 路径规划服务器  和全局规划是相同功能
# 路线固定，变化少；可通过插件选择边权/绕行 适合仓库/厂区固定路线、多机器人协调
route_server:
  ros__parameters:
    # 坐标系设置
    base_frame: "base_link"                       # 机器人的基准坐标系
    route_frame: "map"                            # 全局参考坐标系
    # 路径参数
    path_density: 0.05                            # 将稀疏路线生成密集 nav_msgs/Path 时的点密度（米）
    smoothing_corners: true                       # 是否对相邻边形成的拐角进行平滑
    smoothing_radius: 1.0                         # 用于拐角平滑拟合的圆弧半径
    # 规划参数
    max_iterations: 0                             # 最大搜索迭代次数，若为 0 则使用可能的最大值
    max_planning_time: 2.0                        # 最大规划时间（秒）
    # 文件加载器设置
    graph_file_loader: "GeoJsonGraphFileLoader"   # 默认的图文件加载器名称
    graph_filepath: ""                            # 图文件路径
    plugin: nav2_route::GeoJsonGraphFileLoader    # 要使用的图文件加载器插件
    # 跟踪参数
    tracker_update_rate: 50.0                     # 检查路径跟踪状态的频率（Hz）
    aggregate_blocked_ids: false                  # 是否在整个导航请求周期内聚合被阻塞的 ID，还是仅使用当前被阻塞的 ID
    # 到达判定参数
    boundary_radius_to_achieve_node: 1.0           # 在边界节点（如起点/终点）附近的半径（米），用于评估到达判定
    radius_to_achieve_node: 2.0                    # 在路线节点附近的半径（米），作为到达判定的初步条件
    # 修剪参数
    max_prune_dist_from_edge: 8.0                  # 与某条边的最大距离（米），超过此距离则认为无法修剪该边（例如离边太远就没意义）
    min_prune_dist_from_goal: 0.15                 # 距离目标节点的最小距离（米），超过此距离才会认为目标节点已通过（适用于目标姿态与节点很近但不完全重合的情况）
    min_prune_dist_from_start: 0.10                # 距离起始节点的最小距离（米），超过此距离才会认为起始节点已通过（适用于起始姿态与节点很近但不完全重合的情况）
    # 插件配置
    edge_cost_functions: ["DistanceScorer", "DynamicEdgesScorer"]  # 使用的边权重评分函数
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"

    operations: ["AdjustSpeedLimit", "ReroutingService"] # 使用的路线操作插件
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"


# slam节点参数。启动slam的时候会发布map->odom,不需要amcl,也不需要map_server
slam_toolbox:
  ros__parameters:

    # —— 优化插件配置（Ceres Solver） ——
    solver_plugin: solver_plugins::CeresSolver        # 使用 Ceres 作为优化器
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY       # 线性求解器类型
    ceres_preconditioner: SCHUR_JACOBI                # 预条件器类型
    ceres_trust_strategy: LEVENBERG_MARQUARDT          # 信赖域策略
    ceres_dogleg_type: TRADITIONAL_DOGLEG              # Dogleg 算法类型
    ceres_loss_function: None                         # 损失函数（None 表示无损失函数）

    # —— ROS TF 与话题——
    odom_frame: odom_frame                            # 里程计坐标系名称
    map_frame: map                                    # 地图坐标系名称
    base_frame: base_footprint                        # 机器人底盘坐标系名称
    scan_topic: /scan                                 # 激光雷达数据话题

    # —— 模式 ——（mapping 或 localization）
    mode: mapping                                     # 运行模式：mapping=建图，localization=定位
    map_file_name: ""                                 # 如果是 localization，可指定已保存的地图或位姿图文件
    map_start_pose: [0.0, 0.0, 0.0]                   # 启动时的初始位姿 [x, y, yaw]
    map_start_at_dock: false                          # 是否从充电桩位置开始（自动起点）

    # —— 日志与实时相关参数 ——（可选调试）—
    debug_logging: false                              # 是否开启调试日志
    throttle_scans: 1                                 # 跳帧数（1 表示每帧都处理）
    enable_interactive_mode: true                     # 是否开启交互模式（支持手动编辑地图）

    # —— TF 发布频率和地图更新———
    transform_publish_period: 0.02                    # 发布 map->odom TF 的周期（秒）
    map_update_interval: 3.0                          # 更新地图数据的周期（秒）

    # —— 地图渲染 ——（分辨率与激光测距范围）—
    resolution: 0.05                                  # 地图分辨率（米/格）
    max_laser_range: 12.0                             # 激光雷达最大使用距离（米）

    # —— 时间/缓存控制———
    minimum_time_interval: 0.5                        # 两次处理扫描之间的最小时间间隔（秒）
    transform_timeout: 0.5                            # 等待 TF 超时时间（秒）
    tf_buffer_duration: 30.0                          # TF 缓存时长（秒）
    stack_size_to_use: 40000000                       # 用于序列化大型地图的栈大小（字节）

    # —— Scan Matching 基本设置 ——
    use_scan_matching: true                           # 是否开启激光匹配
    use_scan_barycenter: true                         # 使用扫描质心而不是原点进行匹配
    minimum_travel_distance: 0.5                      # 移动超过多少米才处理新扫描
    minimum_travel_heading: 0.5                       # 旋转超过多少弧度才处理新扫描
    scan_buffer_size: 10                              # 扫描缓存的帧数
    scan_buffer_maximum_scan_distance: 10.0           # 缓存中允许的最大扫描距离（米）

    # —— 回环检测 (loop closure) 参数 ——
    do_loop_closing: true                             # 是否开启回环检测
    link_match_minimum_response_fine: 0.1             # 精匹配最小响应值
    link_scan_maximum_distance: 1.5                   # 相邻扫描匹配的最大距离（米）
    loop_search_maximum_distance: 3.0                 # 回环搜索的最大距离（米）
    loop_match_minimum_chain_size: 10                 # 回环匹配的最小链长度
    loop_match_maximum_variance_coarse: 3.0           # 回环粗匹配的最大方差
    loop_match_minimum_response_coarse: 0.35          # 回环粗匹配的最小响应值
    loop_match_minimum_response_fine: 0.45            # 回环精匹配的最小响应值

    # —— 回环相关的相关性搜索配置 ——
    correlation_search_space_dimension: 0.5           # 相关性搜索空间维度（米）
    correlation_search_space_resolution: 0.01         # 搜索空间分辨率（米）
    correlation_search_space_smear_deviation: 0.1     # 搜索空间平滑偏差

    # —— 回环搜索空间配置 ——
    loop_search_space_dimension: 8.0                  # 回环搜索空间的大小（米）
    loop_search_space_resolution: 0.05                # 回环搜索分辨率（米）
    loop_search_space_smear_deviation: 0.03            # 回环搜索平滑偏差

    # —— Scan Matcher 惩罚：距离与角度 ———
    distance_variance_penalty: 0.5                     # 距离方差惩罚系数
    angle_variance_penalty: 1.0                        # 角度方差惩罚系数
    fine_search_angle_offset: 0.00349                  # 精细搜索角度偏移（弧度）
    coarse_search_angle_offset: 0.349                  # 粗搜索角度偏移（弧度）
    coarse_angle_resolution: 0.0349                    # 粗搜索角度分辨率（弧度）
    minimum_angle_penalty: 0.9                         # 最小角度惩罚系数
    minimum_distance_penalty: 0.5                      # 最小距离惩罚系数
    use_response_expansion: true                       # 是否使用响应扩展提升匹配效果
