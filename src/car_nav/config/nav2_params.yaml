# 全局参数文件，给多个节点使用如AMCL和Nav2和定位节点

amcl:
  ros__parameters:
    # 运动模型相关
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 机器人差速底盘模型，还有全向底盘模型
    base_frame_id: "base_footprint"  # 机器人基座坐标系
    odom_frame_id: "odom_frame"  # 里程计坐标系
    global_frame_id: "map"  # 全局坐标系
    
    scan_topic: "/scan"  # 激光扫描话题
    laser_model_type: "likelihood_field"  # 激光模型类型
    #1：一般推荐：likelihood_field（快、稳定，Nav2 默认）2：高精度 + 光束数少：beam 3：空旷或遮挡多：likelihood_field_prob
    max_beams: 100  # 最大光束数量
    laser_max_range: -1.0  # 激光最大范围单位：米 -1雷达自带上限
    laser_min_range: -1.0  # 激光最小范围 -1雷达自带下限
    laser_likelihood_max_dist: 2.0  # 超过该阈值的光束，被认为和障碍物“无关”，定位贡献很小甚至没有
    do_beamskip: false  # 是否启用光束跳过
    beam_skip_distance: 0.5  # 光束跳过的最小距离
    beam_skip_threshold: 0.3  # 光束跳过的阈值
    beam_skip_error_threshold: 0.9  # 光束跳过的错误阈值
    # 粒子滤波相关
    min_particles: 500  # 最小粒子数量
    max_particles: 2000  # 最大粒子数量
    pf_err: 0.05  # 值越小 → 需要更多粒子来保证误差低
    pf_z: 0.99  # 越接近 1 → 需要更高的置信度，粒子数会偏多
    resample_interval: 1  # 重采样间隔
    # 噪声参数（哪个误差大加哪个）
    alpha1: 0.8  # 旋转引起的旋转噪声（转了越多，朝向不确定性越大）
    alpha2: 0.1  # 平移引起的旋转噪声（走直线也会带来一点朝向误差）
    alpha3: 0.1  # 平移引起的平移噪声（走得越远，位置不确定性越大）
    alpha4: 0.1  # 旋转引起的平移噪声（转动时位置也会抖一点）
    alpha5: 0.1  # 侧向平移噪声项
    sigma_hit: 0.2  # 激光测距与地图匹配误差 的容忍度
    lambda_short: 0.05  # 0.05–0.3；空旷/静态场景偏小，人员密集/遮挡多偏大
    # 权重参数，加起来等于1，如果大于1,会自动按比例缩小到1
    z_hit: 0.6  # 命中模型权重  如果环境比较干净、障碍物位置比较准，可以调大
    z_short: 0.05  # 短距离模型权重  如果环境里人或货物经常移动，可以调大
    z_max: 0.05  # 最大范围模型权重  如果雷达经常返回最大值（空旷环境），可以调大
    z_rand: 0.3  # 随机模型权重  如果雷达噪声多（便宜雷达），可以调大
    # 位姿与初始设置 
    set_initial_pose: false  # 是否设置初始位姿
    always_reset_initial_pose: false  # 换地图时候是否总是重置初始位姿
    first_map_only: false  # 是否仅使用第一张地图
    # initial_pose:  # 初始位姿    ------手动给初始，更详细给初始定位
    #   x: 0.0  # 初始x坐标
    #   y: 0.0  # 初始y坐标
    #   z: 0.0  # 初始z坐标
    #   yaw: 0.0  # 初始航向角
    # 话题相关
    map_topic: "/map"  # 地图话题
    # 其他参数
    introspection_mode: "disabled"  # 自省模式，开启会发布额外的调试信息，正式运行一般关掉减少开销
    tf_broadcast: true  # 是否广播TF
    transform_tolerance: 0.3  # AMCL 发布 TF（map→odom）的延时容忍度（秒）
    update_min_a: 0.03  # 有当机器人转过 至少这个角度 时，才会触发一次定位更新 0.1 rad ≈ 5.7°
    update_min_d: 0.02  # 机器人至少走了这么远，才会触发一次定位更新 0.1 m
    save_pose_rate: 0.5  # 下次启动时，如果没有手动设置初始位姿，AMCL 可以自动恢复到上次保存的位姿。
    recovery_alpha_fast: 0.0  # 快速恢复参数，新环境快速反应定位
    recovery_alpha_slow: 0.0  # 慢速恢复参数，适应环境变化，慢慢补充随机性


ekf_odom:
  ros__parameters:
    use_sim_time: false

  # 运行
    frequency: 50.0                    # 运行频率 (Hz)，EKF 处理循环频率
    sensor_timeout: 0.1               # 传感器超时 (秒)，超过此时间未收到数据则认为失效
    two_d_mode: true                   # 二维模式，仅估计 x,y 和 yaw（忽略 z, roll, pitch）
    predict_to_current_time: true      # 预测到当前时间以补偿传感器/消息延迟
    print_diagnostics: true            # 是否打印诊断信息（用于调试/监控）

    # 坐标系（与你的 /odom_raw 对齐）
    map_frame: map
    odom_frame: odom_frame          # 你的 /odom_raw header.frame_id
    base_link_frame: base_footprint # 你的 /odom_raw child_frame_id
    world_frame: odom_frame         # 建图用map,大部分情况用odom_frame

    # 是否让 EKF 发布 odom_frame->base_footprint TF
    publish_tf: true              # 如需由 EKF 发布，改 true，并关闭其它同名 TF

    # 里程计输入（/odom_raw）
    odom0: /odom_raw
    # 里程计只给: x, y, vx   （yaw 交给 IMU；避免冲突）
    # 位姿/速度选择顺序: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    odom0_config: [true,  true,  false,  # 配置里程计数据的使用，true表示使用对应数据
                   false, false, true,  # x, y, yaw方向的位姿和速度
                   true,  false, false, # 其他方向数据不使用
                   false, false, true,  # 仅使用必要的速度和位姿数据
                   false, false, false] # 其余数据不使用
    odom0_differential: false  # 是否使用差分模式，false表示不使用
    odom0_relative: false  # 是否使用相对模式，false表示不使用
    odom0_queue_size: 100  # 队列大小，表示缓存的最大消息数量

    # IMU 输入（按需改成你的话题名）
    imu0: /imu                 # IMU传感器的话题名，常见为/imu/data或/imu
    # IMU提供: yaw(航向), vyaw(角速度Z), ax/ay(线加速度XY)
    imu0_config:  [false, false, false, # 配置IMU数据的使用，false表示不使用对应数据
                   false, false, false, # 不使用x, y, z方向的位姿
                   false, false, false, # 不使用x, y, z方向的速度
                   false, false, false, # 不使用x, y, z方向的加速度
                   false,  true,  false] # 使用yaw和角速度Z，不使用线加速度
    imu0_differential: false  # 是否使用差分模式，false表示不使用
    imu0_relative: false  # 是否使用相对模式，false表示不使用
    imu0_queue_size: 50  # 队列大小，表示缓存的最大消息数量

    # 若 IMU 的 linear_acceleration 含重力，加这个；若驱动已去重力则设 false
    imu0_remove_gravitational_acceleration: true

    laser_scan_topic: /scan
    laser_scan_config: [true, true, false, true, true, true, true]  # 启用激光数据，仅使用 yaw 信息

    # 如 IMU 安装存在固定偏航角，可设置（单位: rad）。默认 0
    # imu0_yaw_offset: 0.0




# 启动slam的时候会发布map->odom,不需要amcl,也不需要map_server
slam_toolbox:
  ros__parameters:

    # —— 优化插件配置（Ceres Solver） ——
    solver_plugin: solver_plugins::CeresSolver        # 使用 Ceres 作为优化器
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY       # 线性求解器类型
    ceres_preconditioner: SCHUR_JACOBI                # 预条件器类型
    ceres_trust_strategy: LEVENBERG_MARQUARDT          # 信赖域策略
    ceres_dogleg_type: TRADITIONAL_DOGLEG              # Dogleg 算法类型
    ceres_loss_function: None                         # 损失函数（None 表示无损失函数）

    # —— ROS TF 与话题——
    odom_frame: odom_frame                           # 里程计坐标系名称
    map_frame: map                                    # 地图坐标系名称
    base_frame: base_footprint                        # 机器人底盘坐标系名称
    scan_topic: /scan                                 # 激光雷达数据话题

    # —— 模式 ——（mapping 或 localization）
    mode: mapping                                     # 运行模式：mapping=建图，localization=定位
    map_file_name: ""                                 # 如果是 localization，可指定已保存的地图或位姿图文件
    map_start_pose: [0.0, 0.0, 0.0]                   # 启动时的初始位姿 [x, y, yaw]
    map_start_at_dock: false                          # 是否从充电桩位置开始（自动起点）

    # —— 日志与实时相关参数 ——（可选调试）—
    debug_logging: false                              # 是否开启调试日志
    throttle_scans: 1                                 # 跳帧数（1 表示每帧都处理）
    enable_interactive_mode: true                     # 是否开启交互模式（支持手动编辑地图）

    # —— TF 发布频率和地图更新———
    transform_publish_period: 0.02                    # 发布 map->odom TF 的周期（秒）
    map_update_interval: 0.2                          # 更新地图数据的周期（秒）

    # —— 地图渲染 ——（分辨率与激光测距范围）—
    resolution: 0.05                                  # 地图分辨率（米/格）
    max_laser_range: 12.0                             # 激光雷达最大使用距离（米）

    # —— 时间/缓存控制———
    minimum_time_interval: 0.5                        # 两次处理扫描之间的最小时间间隔（秒）
    transform_timeout: 0.5                            # 等待 TF 超时时间（秒）
    tf_buffer_duration: 30.0                          # TF 缓存时长（秒）
    stack_size_to_use: 40000000                       # 用于序列化大型地图的栈大小（字节）

    # —— Scan Matching 基本设置 ——
    use_scan_matching: true                           # 是否开启激光匹配
    use_scan_barycenter: true                         # 使用扫描质心而不是原点进行匹配
    minimum_travel_distance: 0.05                      # 移动超过多少米才处理新扫描
    minimum_travel_heading: 0.05                       # 旋转超过多少弧度才处理新扫描
    scan_buffer_size: 100                             # 扫描缓存的帧数
    scan_buffer_maximum_scan_distance: 10.0           # 缓存中允许的最大扫描距离（米）
    scan_matching_max_iterations: 100                 # 增加迭代次数，提高精度
    scan_matching_max_distance: 0.5                   # 限制每次匹配的最大扫描距离
    laser_scan_queue_size: 100  # 增加队列大小


    # —— 回环检测 (loop closure) 参数 ——
    do_loop_closing: true                             # 是否开启回环检测
    link_match_minimum_response_fine: 0.1             # 精匹配最小响应值
    link_scan_maximum_distance: 1.5                   # 相邻扫描匹配的最大距离（米）
    loop_search_maximum_distance: 3.0                 # 回环搜索的最大距离（米）
    loop_match_minimum_chain_size: 10                 # 回环匹配的最小链长度
    loop_match_maximum_variance_coarse: 3.0           # 回环粗匹配的最大方差
    loop_match_minimum_response_coarse: 0.35          # 回环粗匹配的最小响应值
    loop_match_minimum_response_fine: 0.45            # 回环精匹配的最小响应值

    # —— 回环相关的相关性搜索配置 ——
    correlation_search_space_dimension: 0.5           # 相关性搜索空间维度（米）
    correlation_search_space_resolution: 0.01         # 搜索空间分辨率（米）
    correlation_search_space_smear_deviation: 0.1     # 搜索空间平滑偏差

    # —— 回环搜索空间配置 ——
    loop_search_space_dimension: 8.0                  # 回环搜索空间的大小（米）
    loop_search_space_resolution: 0.05                # 回环搜索分辨率（米）
    loop_search_space_smear_deviation: 0.03            # 回环搜索平滑偏差

    # —— Scan Matcher 惩罚：距离与角度 ———
    distance_variance_penalty: 0.5                     # 距离方差惩罚系数
    angle_variance_penalty: 1.0                        # 角度方差惩罚系数
    fine_search_angle_offset: 0.00349                  # 精细搜索角度偏移（弧度）
    coarse_search_angle_offset: 0.349                  # 粗搜索角度偏移（弧度）
    coarse_angle_resolution: 0.0349                    # 粗搜索角度分辨率（弧度）
    minimum_angle_penalty: 0.9                         # 最小角度惩罚系数
    minimum_distance_penalty: 0.5                      # 最小距离惩罚系数
    use_response_expansion: true                       # 是否使用响应扩展提升匹配效果





waypoint_follower:
  ros__parameters:
    loop_rate: 20                 # 查询当前子任务结果的频率
    stop_on_failure: false        # 某个点失败时是否停止（true=停止）
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:             # 到每个点后可“停一下”
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0  # 毫秒；>0 则每个点停这么久



