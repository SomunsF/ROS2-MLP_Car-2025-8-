behavior_server:  # 行为服务器（专门执行恢复动作）当局部规划失败可以触发
  ros__parameters:
    use_sim_time: false  # 不使用仿真时间
    global_frame: map    # 全局坐标系
    robot_base_frame: base_footprint  # 机器人基座坐标系
    transform_tolerance: 0.5  # 增加变换容差
    costmap_topic: global_costmap/costmap_raw  # 代价地图话题
    footprint_topic: global_costmap/published_footprint  # 足迹话题
    cycle_frequency: 10.0  # 增加循环频率
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]  # 行为插件列表
    spin:
      plugin: "nav2_behaviors/Spin"  # 旋转行为
    backup:
      plugin: "nav2_behaviors/BackUp"  # 后退行为
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"  # 朝向驱动行为
    wait:
      plugin: "nav2_behaviors/Wait"  # 等待行为
    


# 给全局路径规划器（控制器）提供实时环境信息。
# 大范围：覆盖整个已知地图（map frame）
# 静态层（static_layer）：加载已有地图（如 SLAM 保存的地图）
# 障碍层（obstacle_layer）：加入动态障碍物信息（来自雷达等）
# 膨胀层（inflation_layer）：把障碍物区域“膨胀”，给机器人留安全距离
# 输出：一张全局代价地图，供全局规划器用来生成 最优路径（Dijkstra/A*）。

global_costmap:  # 全局代价地图
  global_costmap:
    ros__parameters:
      
      global_frame: map  # 全局坐标系
      robot_base_frame: base_footprint  # 机器人基础坐标系
      use_sim_time: false  # 不使用仿真时间
      transform_tolerance: 0.3
      update_frequency: 10.0 # 
      publish_frequency: 10.0 # 
      robot_radius: 0.05  # 机器人半径(米)
      resolution: 0.05  # 地图分辨率(米/像素)
      static_map: true          # 用静态占据栅格
      rolling_window: false
      track_unknown_space: true  # 跟踪未知空间
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 插件列表
      obstacle_layer:  # 障碍物层配置
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 障碍物层插件
        enabled: True  # 启用障碍物层
        observation_sources: scan  # 观测数据源
        scan:  # 激光扫描配置
          topic: /scan  # 激光话题
          max_obstacle_height: 2.0  # 最大障碍物高度(米)
          clearing: True  # 启用清除
          marking: True  # 启用标记
          data_type: "LaserScan"  # 数据类型
          raytrace_max_range: 3.0  # 射线追踪最大范围(米)
          raytrace_min_range: 0.0  # 射线追踪最小范围(米)
          obstacle_max_range: 2.5  # 障碍物最大范围(米)
          obstacle_min_range: 0.0  # 障碍物最小范围(米)
      static_layer:  # 静态层配置
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态层插件
        map_subscribe_transient_local: True  # 地图订阅本地持久化
      inflation_layer:  # 膨胀层配置
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件
        cost_scaling_factor: 1.0  # 进一步降低代价缩放因子，减少高代价区域
        inflation_radius: 0.1  # 进一步减少膨胀半径(米)
        inflate_unknown: false  # 不对未知区域进行膨胀
        inflate_around_unknown: false  # 不在未知区域周围膨胀
      always_send_full_costmap: True  # 始终发送完整代价地图


# 给局部路径规划器（控制器）提供实时环境信息。
# 小范围以机器人为中心的局部窗口（例如 3m × 3m）
# 实时更新：频率更高（比如 5Hz），更灵敏地反应新出现的障碍物
# voxel_layer：三维障碍物建模（常用在激光/深度相机）
# inflation_layer：安全距离
# rolling_window：跟随机器人移动的滑动窗口

local_costmap:  # 局部代价地图
  local_costmap:
    ros__parameters:
      
      global_frame: odom_frame         # 局部代价地图使用odom坐标系
      robot_base_frame: base_footprint  # 机器人基础坐标系
      transform_tolerance: 0.3
      update_frequency: 20.0
      publish_frequency: 20.0
      use_sim_time: false  # 不使用仿真时间
      rolling_window: true  # 启用滚动窗口
      width: 3             # 地图宽度(米) - 增大一点
      height: 3            # 地图高度(米) - 增大一点
      resolution: 0.05     # 地图分辨率(米/像素)
      robot_radius: 0.05   # 机器人半径(米)
      plugins: ["voxel_layer", "inflation_layer"]  # 插件列表
      inflation_layer:  # 膨胀层配置
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件
        cost_scaling_factor: 1.0  # 进一步降低代价缩放因子
        inflation_radius: 0.08  # 进一步减少膨胀半径(米) - 局部地图可以更紧密
        inflate_unknown: false  # 不对未知区域进行膨胀
      voxel_layer:  # 体素层配置
        plugin: "nav2_costmap_2d::VoxelLayer"  # 体素层插件
        enabled: True  # 启用体素层
        publish_voxel_map: True  # 发布体素地图
        origin_z: 0.0  # 起始z坐标(米)
        z_resolution: 0.05  # z方向分辨率(米)
        z_voxels: 16  # z方向体素数量
        max_obstacle_height: 2.0  # 最大障碍物高度(米)
        mark_threshold: 0  # 标记阈值
        observation_sources: scan  # 观测数据源
        scan:  # 激光扫描配置
          topic: /scan  # 激光话题
          max_obstacle_height: 2.0  # 最大障碍物高度(米)
          clearing: True  # 启用清除
          marking: True  # 启用标记
          data_type: "LaserScan"  # 数据类型
          raytrace_max_range: 3.0  # 射线追踪最大范围(米)
          raytrace_min_range: 0.0  # 射线追踪最小范围(米)
          obstacle_max_range: 2.5  # 障碍物最大范围(米)
          obstacle_min_range: 0.0  # 障碍物最小范围(米)
      static_layer:  # 静态层配置
        map_subscribe_transient_local: True  # 地图订阅本地持久化
      always_send_full_costmap: True  # 始终发送完整代价地图



