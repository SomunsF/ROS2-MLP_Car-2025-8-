planner_server:
  ros__parameters:
    planner_frequency: 0.5
    planner_plugins: ["zzz"]
    zzz:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "MOORE"
      cost_travel_multiplier: 0.8
      use_final_approach_orientation: false
      lethal_cost: 240
      neutral_cost: 45
      minimum_turning_radius: 0.0
      smooth_path: true
      allow_primitive_interpolation: true
      cache_collision_check_distance: 0.1
      debug_visualizations: false
      smoother:
        max_its: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    # 控制服务器参数（更多信息请参考Controller Server文档）
    use_sim_time: false
    controller_frequency: 3.0  # 提高控制器频率到3Hz，满足BT树要求，避免频繁取消
    tf_buffer_duration: 30.0   # TF缓存持续时间（秒），根据链路延迟/频率设置，常用值为30~60秒
    min_x_velocity_threshold: 0.001  # 最小X方向速度阈值
    min_y_velocity_threshold: 0.001  # 最小Y方向速度阈值
    min_theta_velocity_threshold: 0.001  # 最小角速度阈值
    goal_checker_plugins: ["goal_checker"]  # 目标检查插件列表
    controller_plugins: [ "RotationShimController"]  # 控制器插件列表
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"  # 目标检查插件
      xy_goal_tolerance: 0.2  # 增加XY方向目标容差（米）
      yaw_goal_tolerance: 6.28  # 增加航向角目标容差（弧度）
      stateful: true  # 启用有状态目标检查以提高稳定性

    # 用于预旋转的Rotation Shim Controller
    RotationShimController:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "zzzplan::EndToEndController"  # 主控制器的完整类名
      angular_dist_threshold: 1.57             # 角度阈值90度，减少不必要的预旋转切换
      forward_sampling_distance: 0.8           # 增加前向采样距离，提高稳定性
      rotate_to_heading_angular_vel: 0.8       # 适中的旋转角速度，避免过于激进
      max_angular_accel: 2.0                   # 适中的角加速度，提高平滑性
      simulate_ahead_time: 1.2                 # 增加模拟提前时间，提高稳定性
      # 内部EndToEndController需要的参数
      model_path: "/home/zzz/ros2_car/ros2/end-end_train/cnn_model_1.5s.pt"  # PyTorch模型路径
      lookahead_distance: 0.5               # 内部控制器前瞻距离
      min_lookahead_distance: 0.2          # 内部控制器最小前瞻距离
      goal_tolerance: 0.15                  # 目标容差
      input_size: 364                       # 模型输入维度
      output_size: 2                        # 模型输出维度
      max_linear_velocity: 0.3              # 最大线速度
      min_linear_velocity: 0.01             # 最小线速度


    # FollowPath:
    #   plugin: "nav2_rotation_shim_controller::RotationShimController"
    #   primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

    #       # 1) 姿态/切换（Angle / Engagement）
    #   angular_dist_threshold: 1.57  #搭配使用 角度距离阈值（rad） # 注：与目的地的夹角超过90°会触发原地旋转对齐
    #   angular_disengage_threshold: 0.4  #搭配使用 脱离角度阈值（rad）  # 注：超过此角度会退出对齐/保持模式，在0.4角度以内就不旋转了直接走

    #   rotate_to_goal_heading: false  #搭配使用 是否在到达位置前旋转到目标朝向  # 注：false=先到目的地再旋转对齐目标朝向
    #   use_rotate_to_heading: true  #搭配使用 启用旋转到朝向的辅助逻辑  # 注：控制器会尝试调整朝向以改善到达姿态

    #   rotate_to_heading_angular_vel: 1.2  # 旋转到目标时的角速度上限（rad/s）  # 注：限制对齐时的最大角速度以防抖动

    #       # 2) 前瞻 / 轨迹采样（Lookahead & Sampling）
    #   forward_sampling_distance: 0.4  # 前向采样距离（m）  # 注：值越大，采样点越稀，越不平滑。用于在路径上选取参考点，影响平滑性
    #   simulate_ahead_time: 1.5  # 轨迹模拟前瞻时间（s）  # 注：预测1.5秒后的轨迹会不会发生碰撞
    #   lookahead_dist: 0.4  # 注：默认前瞻距离，用于追踪目标点
    #   min_lookahead_dist: 0.2  # 注：前瞻距离下限，用于速度/近障碍时收缩前瞻
    #   max_lookahead_dist: 0.8  # 注：前瞻距离上限，避免过远导致穿越障碍
    #   use_velocity_scaled_lookahead_dist: true  # 注：是否根据速度动态缩放前瞻距离
    #   use_fixed_curvature_lookahead: false  # 注：是否使用固定曲率前瞻（影响曲率估计）
    #   curvature_lookahead_dist: 0.4  # 注：用于计算曲率的前瞻距离（m）

    #       # 3) 速度 / 加速度 / 缩放（Velocity & Scaling）
    #   desired_linear_vel: 0.35  # 期望线速度（m/s）  # 注：用于常规巡航速度设置
    #   min_approach_linear_velocity: 0.1  # 注：接近目标时的最小线速度，防止停滞
    #   regulated_linear_scaling_min_speed: 0.1  # 注：受控缩放时保证的最低速度
    #   max_angular_accel: 1.8  # 注：角加速度上限（rad/s^2），降低可使旋转更平滑
